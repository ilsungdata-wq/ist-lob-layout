name: LOB MCP smoke tests

on:
  pull_request:
    paths:
      - 'supabase/functions/lob-mcp/**'
      - 'tests/lob-mcp.test.mjs'
      - '.github/workflows/test-lob-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check MCP JSON-RPC and published-only contract
        run: node --test tests/lob-mcp.test.mjs
