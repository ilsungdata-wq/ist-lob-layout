name: Migrate, verify and deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  changes:
    name: Detect database and function changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- supabase; then
            echo "backend=false" >> "$GITHUB_OUTPUT"
          else
            echo "backend=true" >> "$GITHUB_OUTPUT"
          fi

  migrate:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: Apply and verify Supabase migrations
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate migration configuration
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing secret SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing secret SUPABASE_DB_PASSWORD" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing variable SUPABASE_PROJECT_REF" && exit 1)
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Resolve Supabase IPv4 pooler
        shell: bash
        run: |
          project_json="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF")"
          region="$(jq -r '.region // empty' <<< "$project_json")"
          test -n "$region" || (echo "Supabase project region is unavailable" && exit 1)
          pooler_host="aws-0-${region}.pooler.supabase.com"
          getent hosts "$pooler_host" >/dev/null || (echo "Supabase IPv4 pooler DNS lookup failed" && exit 1)
          encoded_password="$(jq -rn --arg value "$SUPABASE_DB_PASSWORD" '$value | @uri')"
          db_url="postgresql://postgres.${SUPABASE_PROJECT_REF}:${encoded_password}@${pooler_host}:5432/postgres?sslmode=require"
          echo "::add-mask::$encoded_password"
          echo "::add-mask::$db_url"
          echo "SUPABASE_DB_URL=$db_url" >> "$GITHUB_ENV"
      - name: Reconcile manually-applied foundation migration
        continue-on-error: true
        run: supabase migration repair 20261006000100 --db-url "$SUPABASE_DB_URL" --status applied
      - name: Reconcile manually-applied anonymous policy migration
        continue-on-error: true
        run: supabase migration repair 20261006000200 --db-url "$SUPABASE_DB_URL" --status applied
      - name: Inspect migration history
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
      - name: Preview pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
      - name: Apply pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
      - name: Lint production schema
        run: supabase db lint --db-url "$SUPABASE_DB_URL" --level error --fail-on error
      - name: Verify production workflow schema
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --file=supabase/verify_deployment_gate.sql
      - name: Detect Edge Function changes
        id: edge_changes
        shell: bash
        run: |
          if git diff --quiet HEAD^ HEAD -- supabase/functions/st-sheet-sync; then
            echo "st_sync=false" >> "$GITHUB_OUTPUT"
          else
            echo "st_sync=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet HEAD^ HEAD -- supabase/functions/lob-mcp; then
            echo "lob_mcp=false" >> "$GITHUB_OUTPUT"
          else
            echo "lob_mcp=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy S/T Google Sheet sync function
        if: steps.edge_changes.outputs.st_sync == 'true'
        # config.toml already sets verify_jwt=false. Use the current remote deploy syntax,
        # keep diagnostics visible, and fail the release if the synchronization backend is unavailable.
        run: supabase functions deploy st-sheet-sync --remote="$SUPABASE_PROJECT_REF" --yes --debug
      - name: Deploy published-only LOB MCP function
        if: steps.edge_changes.outputs.lob_mcp == 'true'
        run: supabase functions deploy lob-mcp --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

  test:
    name: Test application
    runs-on: ubuntu-latest
    needs: [changes, migrate]
    if: always() && needs.changes.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript syntax
        # node:module.stripTypeScriptTypes is used by the Edge Function auth tests.
        run: |
          node --check app.js
          node --check studio.js
          node --check fabric-engine.js
          node --check professional-editor.js
          node --check office-page-editor.js
          node --check supabase-integration.js
          node --check st-info.js
      - name: Unit and workflow contract tests
        run: node --test tests/*.test.mjs
      - name: Verify generated worker
        run: |
          node scripts/verify-worker.mjs

  build:
    name: Build GitHub Pages artifact
    runs-on: ubuntu-latest
    needs: test
    if: always() && needs.test.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - name: Validate Supabase runtime configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing repository variable SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_PUBLISHABLE_KEY" || (echo "Missing repository secret SUPABASE_PUBLISHABLE_KEY" && exit 1)
      - name: Assemble static site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node scripts/generate-supabase-config.mjs
          node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    concurrency:
      group: github-pages-publish
      cancel-in-progress: false
    name: Deploy GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: always() && needs.build.result == 'success'
    steps:
      - name: Check latest main revision
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "Skipping outdated frontend deployment."
          fi
      - name: Deploy to GitHub Pages
        if: steps.latest.outputs.is_latest == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        if: steps.latest.outputs.is_latest == 'true'
      - uses: actions/setup-node@v4
        if: steps.latest.outputs.is_latest == 'true'
        with:
          node-version: '24'
      - name: Verify published release and assets
        if: steps.latest.outputs.is_latest == 'true'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-release.mjs
