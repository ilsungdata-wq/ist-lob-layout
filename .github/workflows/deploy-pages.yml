name: Migrate, verify and deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply and verify Supabase migrations
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate migration configuration
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing secret SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing secret SUPABASE_DB_PASSWORD" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing variable SUPABASE_PROJECT_REF" && exit 1)
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Resolve Supabase IPv4 pooler
        shell: bash
        run: |
          project_json="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF")"
          region="$(jq -r '.region // empty' <<< "$project_json")"
          test -n "$region" || (echo "Supabase project region is unavailable" && exit 1)
          pooler_host="aws-0-${region}.pooler.supabase.com"
          getent hosts "$pooler_host" >/dev/null || (echo "Supabase IPv4 pooler DNS lookup failed" && exit 1)
          encoded_password="$(jq -rn --arg value "$SUPABASE_DB_PASSWORD" '$value | @uri')"
          db_url="postgresql://postgres.${SUPABASE_PROJECT_REF}:${encoded_password}@${pooler_host}:5432/postgres?sslmode=require"
          echo "::add-mask::$encoded_password"
          echo "::add-mask::$db_url"
          echo "SUPABASE_DB_URL=$db_url" >> "$GITHUB_ENV"
      - name: Reconcile manually-applied foundation migration
        continue-on-error: true
        run: supabase migration repair 20261006000100 --db-url "$SUPABASE_DB_URL" --status applied
      - name: Reconcile manually-applied anonymous policy migration
        continue-on-error: true
        run: supabase migration repair 20261006000200 --db-url "$SUPABASE_DB_URL" --status applied
      - name: Inspect migration history
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
      - name: Preview pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
      - name: Apply pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
      - name: Lint production schema
        run: supabase db lint --db-url "$SUPABASE_DB_URL" --level error --fail-on error
      - name: Verify production workflow schema
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --file=supabase/verify_deployment_gate.sql

  test:
    name: Test application
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check studio.js
          node --check fabric-engine.js
          node --check professional-editor.js
          node --check office-page-editor.js
          node --check supabase-integration.js
      - name: Unit and workflow contract tests
        run: node --test tests/*.test.mjs
      - name: Verify generated worker
        run: |
          node build-worker.mjs
          node --check dist/server/index.js
          git diff --exit-code -- dist

  build:
    name: Build GitHub Pages artifact
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Validate Supabase runtime configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing repository variable SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_PUBLISHABLE_KEY" || (echo "Missing repository secret SUPABASE_PUBLISHABLE_KEY" && exit 1)
      - name: Assemble static site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node scripts/generate-supabase-config.mjs
          mkdir -p _site
          cp index.html *.js *.css *.png *.LICENSE _site/
          cp -R vendor layout-reference services _site/
          touch _site/.nojekyll
          mv supabase-config.js _site/supabase-config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
