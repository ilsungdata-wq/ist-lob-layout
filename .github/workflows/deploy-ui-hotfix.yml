name: Deploy UI-only changes to GitHub Pages

on:
  # Main pushes use the production workflow; this is an explicit UI-only fallback.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-ui-only
  cancel-in-progress: false

jobs:
  verify-and-build:
    name: Verify and build static webapp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check studio.js
          node --check wi-spec-sync.js
          node --check fabric-engine.js
          node --check professional-editor.js
          node --check office-page-editor.js
          node --check supabase-integration.js
          node --check inline-layout-reference.js
          node --check mobile-ux.js
          node --check st-info.js
      - name: Run unit tests
        run: node --test tests/*.test.mjs
      - uses: actions/configure-pages@v5
      - name: Validate production frontend config
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing variable SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_PUBLISHABLE_KEY" || (echo "Missing secret SUPABASE_PUBLISHABLE_KEY" && exit 1)
      - name: Assemble static webapp
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node scripts/generate-supabase-config.mjs
          node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    concurrency:
      group: github-pages-publish
      cancel-in-progress: false
    name: Deploy static UI to GitHub Pages
    runs-on: ubuntu-latest
    needs: verify-and-build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check latest main revision
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "Skipping outdated frontend deployment."
          fi
      - name: Publish UI
        if: steps.latest.outputs.is_latest == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        if: steps.latest.outputs.is_latest == 'true'
      - uses: actions/setup-node@v4
        if: steps.latest.outputs.is_latest == 'true'
        with:
          node-version: '24'
      - name: Verify published release and assets
        if: steps.latest.outputs.is_latest == 'true'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-release.mjs
