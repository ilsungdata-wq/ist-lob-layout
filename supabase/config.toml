project_id = "ist-lob-layout"

# Validate the user with Supabase Auth inside the function, then require is_admin.
# Avoid the gateway's legacy JWT verification for rotated/asymmetric signing keys.
[functions.st-sheet-sync]
verify_jwt = false

# MCP tools are deliberately restricted to the existing ANONYMOUS Published
# read RPCs. ChatGPT connects without OAuth in this first read-only phase.
[functions.lob-mcp]
verify_jwt = false
